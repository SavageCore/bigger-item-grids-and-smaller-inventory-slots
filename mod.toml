# bigger_item_grids_fixes: runtime halves of the bigger-grids mod.
# Both halves work together; the overlay toggles below switch each
# half's code, and the matching static UI MBINs (8x3 popups, scaled
# slots/boxes, inventory pages) must ship alongside.
[mod]
id = "eu.savagecore.bigger_item_grids_fixes"
version = "0.2.1"
label = "Bigger Item Grids and Smaller Inventory Slots"
description = "See more slots on screen in the inventory and Crafting/Transfer popups."
enabled = true

[[mod.text]]
lang = "nl"
description = "Zie meer slots op het scherm in de inventaris en de Crafting- en Transfer-pop-ups."

[[mod.text]]
lang = "de"
description = "Zeigt mehr Slots im Inventar und in den Crafting- und Transfer-Pop-ups an."

[[mod.text]]
lang = "fr"
description = "Affiche plus de slots à l'écran dans l'inventaire et les popups de fabrication et de transfert."

[[mod.text]]
lang = "it"
description = "Mostra più slot sullo schermo nell'inventario e nei popup di fabbricazione e trasferimento."

[[mod.text]]
lang = "es"
description = "Muestra más slots en pantalla en el inventario y en las ventanas de fabricación y transferencia."

[[mod.text]]
lang = "es-419"
description = "Muestra más slots en pantalla en el inventario y en las ventanas de fabricación y transferencia."

[[mod.text]]
lang = "ru"
description = "Показывает больше слотов на экране в инвентаре и всплывающих окнах создания и передачи."

[[mod.text]]
lang = "pl"
description = "Pokazuje więcej slotów na ekranie w ekwipunku oraz w oknach tworzenia i przenoszenia."

